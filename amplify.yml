version: 1
frontend:
  phases:
    preBuild:
      commands:
        # La imagen de build de Amplify trae un Node que ya cumple el
        # `engines.node` (>=20.9) de package.json. Si alguna vez usas una
        # imagen antigua, descomenta la linea siguiente:
        # - nvm install 20 && nvm use 20
        - npm ci
    build:
      commands:
        # Un fallo de tipos o de lint detiene el despliegue.
        - npm run typecheck
        - npm run lint
        - npm run build
  artifacts:
    # Modo SSR (Amplify Hosting compute). Amplify detecta Next.js y despliega
    # el adaptador de compute a partir de .next. Para cambiar a sitio estatico:
    # anadir `output: 'export'` + `images.unoptimized` en next.config.ts y
    # apuntar baseDirectory a `out`.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
