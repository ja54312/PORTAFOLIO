version: 1
frontend:
  phases:
    preBuild:
      commands:
        # La imagen de build de Amplify trae un Node que ya cumple el
        # `engines.node` (>=20.9) de package.json. Si alguna vez usas una
        # imagen antigua, descomenta la linea siguiente:
        # - nvm install 20 && nvm use 20
        - npm ci
    build:
      commands:
        # Un fallo de tipos o de lint detiene el despliegue.
        - npm run typecheck
        - npm run lint
        - npm run build
  artifacts:
    # Sitio estatico: `output: 'export'` en next.config.ts genera `out/`.
    # Amplify lo sirve desde el CDN, sin aprovisionar compute.
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
